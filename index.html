<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071a3a">
  <title>Splash Pressure Washing</title>
  <noscript><meta http-equiv="refresh" content="0; url=https://splashwashing.com/"></noscript>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071a3a; color: #cfe0f5;
      font: 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    a { color: #7fd3f7; }
  </style>
</head>
<body>
  <p>Taking you to <a href="https://splashwashing.com/">splashwashing.com</a>&hellip;</p>
  <script src="cleanup.js"></script>
  <script>
    (function () {
      var gone = false;
      function go() {
        if (gone) return;
        gone = true;
        location.replace('https://splashwashing.com/');
      }
      (window.splashCleanup || Promise.resolve()).then(go, go);
      setTimeout(go, 1500);
    })();
  </script>
</body>
</html>
